name: PaDELPy2 Tests

on:
  schedule:
    - cron: 0 0 * * 0
  push:
    branches: [main]
    paths:
      - "padelpy2/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/run_tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "padelpy2/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/run_tests.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check padelpy2 tests

      - name: Ruff format check
        run: ruff format --check padelpy2 tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # RDKit 2026.3.4 (oracle pin) publishes wheels for 3.10+ on Linux.
        python-version: ["3.10", "3.11"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          # Calculator/oracle tests need the calc extra (pandas + RDKit).
          # Pin RDKit 2026.3.4 to match stock-JAR oracle fixtures.
          pip install -e ".[dev,calc]"
          pip install "rdkit==2026.3.4"

      - name: Run tests with coverage
        run: |
          python -m pytest tests \
            --cov=padelpy2 \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
