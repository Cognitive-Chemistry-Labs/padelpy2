[build-system]
requires = ["setuptools==76.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "padelpy2"
version = "0.1.0"
description = "A Python wrapper for PaDEL-Descriptor"
authors = [
    { name = "Travis Kessler", email = "travis@cognichem.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = []

[project.optional-dependencies]
pandas = [
    "pandas",
]
rdkit = [
    "rdkit>=2024.3.1",
]
calc = [
    "padelpy2[pandas,rdkit]",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinxcontrib-napoleon>=0.7",
]

[project.urls]
repository = "https://github.com/Cognitive-Chemistry-Labs/padelpy2"

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["padelpy2", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter preference; existing prose/docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.coverage.run]
branch = true
source = ["padelpy2"]
omit = [
    "padelpy2/PaDEL-Descriptor/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
